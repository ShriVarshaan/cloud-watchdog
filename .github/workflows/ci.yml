name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typecheck, lint and unit tests. Unit tests cannot reach the network.
      - run: npm run check

      # Builds the app and drives it with Playwright. No AWS credentials exist here.
      - run: npm run test:e2e
        env:
          CI: 'true'

      # Packages the app (no installer) and smoke-tests the packaged exe:
      # fuses, page loaded from app.asar, IPC, database. No AWS call is made.
      - run: npm run test:packaged

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
